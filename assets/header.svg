<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="maurolando - desierto nocturno con cactus, un coche y un ecualizador">
  <title>maurolando</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#050b1a"/>
      <stop offset="45%" stop-color="#0a2342"/>
      <stop offset="100%" stop-color="#0b3b2e"/>
    </linearGradient>
    <linearGradient id="cactus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c6b4a"/>
      <stop offset="55%" stop-color="#2f9e6b"/>
      <stop offset="100%" stop-color="#12513a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101c1a"/>
      <stop offset="100%" stop-color="#060d0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4f9cf9" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4f9cf9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="280" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#sky)"/>
    <circle cx="880" cy="58" r="150" fill="url(#glow)"/>

    <!-- luna -->
    <circle cx="884" cy="52" r="20" fill="#e8f4ff" opacity="0.92"/>
    <circle cx="876" cy="46" r="4" fill="#c9dcea" opacity="0.5"/>
    <circle cx="891" cy="60" r="2.6" fill="#c9dcea" opacity="0.45"/>

    <!-- estrellas -->
    <g fill="#dff3ff">
      <circle cx="60" cy="34" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="148" cy="62" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="232" cy="28" r="1.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="318" cy="52" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="404" cy="24" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="486" cy="48" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="22" r="1.6"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="642" cy="46" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.7s" repeatCount="indefinite"/></circle>
      <circle cx="712" cy="20" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="96" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="104" cy="96" r="1"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="4.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- cerros lejanos -->
    <path d="M0 196 L120 150 L210 190 L300 154 L420 198 L520 168 L640 200 L760 158 L880 196 L1000 166 L1000 280 L0 280 Z" fill="#0a2b26" opacity="0.85"/>
    <path d="M0 214 L140 184 L280 212 L430 186 L600 216 L760 190 L900 214 L1000 198 L1000 280 L0 280 Z" fill="#0d3a30"/>

    <!-- cactus -->
    <g stroke="url(#cactus)" fill="url(#cactus)" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(672 216)">
        <rect x="-10" y="-104" width="20" height="106" rx="10" stroke="none"/>
        <path d="M-9 -60 L-28 -60 L-28 -86" fill="none" stroke-width="15"/>
        <path d="M9 -74 L30 -74 L30 -96" fill="none" stroke-width="15"/>
      </g>
      <g transform="translate(760 220) scale(0.62)">
        <rect x="-10" y="-104" width="20" height="106" rx="10" stroke="none"/>
        <path d="M9 -58 L28 -58 L28 -80" fill="none" stroke-width="15"/>
      </g>
      <g transform="translate(910 218) scale(0.86)">
        <rect x="-10" y="-104" width="20" height="106" rx="10" stroke="none"/>
        <path d="M-9 -66 L-30 -66 L-30 -90" fill="none" stroke-width="15"/>
      </g>
    </g>
    <!-- espinas / costillas -->
    <g stroke="#7be39b" stroke-width="1.2" opacity="0.35" stroke-linecap="round">
      <line x1="668" y1="118" x2="668" y2="206"/><line x1="676" y1="118" x2="676" y2="206"/>
      <line x1="906" y1="140" x2="906" y2="210"/><line x1="914" y1="140" x2="914" y2="210"/>
    </g>

    <!-- ruta -->
    <rect x="0" y="236" width="1000" height="44" fill="url(#road)"/>
    <line x1="0" y1="238" x2="1000" y2="238" stroke="#2f9e6b" stroke-width="1.5" opacity="0.4"/>
    <g stroke="#7be39b" stroke-width="3" stroke-dasharray="34 26" opacity="0.5">
      <line x1="-60" y1="262" x2="1060" y2="262">
        <animate attributeName="stroke-dashoffset" values="0;-120" dur="1.1s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- coche -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-160,0;1120,0" dur="11s" repeatCount="indefinite"/>
      <g transform="translate(0 214)">
        <ellipse cx="46" cy="42" rx="52" ry="5" fill="#000" opacity="0.35"/>
        <path d="M124 30 L210 22 L210 42 L124 42 Z" fill="url(#beam)"/>
        <path d="M6 30 q0 -9 9 -11 l16 -14 q5 -4 12 -4 h30 q7 0 12 4 l14 14 l14 2 q9 1 9 9 v7 q0 3 -4 3 h-9
                 a11 11 0 0 0 -22 0 h-28 a11 11 0 0 0 -22 0 h-8 q-4 0 -4 -4 z" fill="#123a2d" stroke="#2f9e6b" stroke-width="1.6"/>
        <path d="M34 18 h26 v11 h-34 z" fill="#4f9cf9" opacity="0.55"/>
        <path d="M66 18 h12 l11 11 h-23 z" fill="#4f9cf9" opacity="0.45"/>
        <circle cx="122" cy="32" r="3.6" fill="#ffe9a8"/>
        <circle cx="9" cy="30" r="2.4" fill="#ff5f56" opacity="0.85"/>
        <g fill="#08110f" stroke="#2f9e6b" stroke-width="1.4">
          <circle cx="30" cy="40" r="9"/><circle cx="86" cy="40" r="9"/>
        </g>
        <g fill="#7be39b"><circle cx="30" cy="40" r="3"/><circle cx="86" cy="40" r="3"/></g>
      </g>
    </g>

    <!-- ecualizador -->
    <g transform="translate(52 218)" fill="#2f9e6b">
      <g transform="translate(0 0)"><rect x="0" y="-26" width="6" height="26" rx="3">
        <animateTransform attributeName="transform" type="scale" values="1 0.35;1 1;1 0.5;1 0.85;1 0.35" dur="1.3s" repeatCount="indefinite" additive="sum"/></rect></g>
      <g><rect x="11" y="-26" width="6" height="26" rx="3" fill="#3fb87c">
        <animateTransform attributeName="transform" type="scale" values="1 1;1 0.4;1 0.9;1 0.3;1 1" dur="1.05s" repeatCount="indefinite" additive="sum"/></rect></g>
      <g><rect x="22" y="-26" width="6" height="26" rx="3" fill="#5ed092">
        <animateTransform attributeName="transform" type="scale" values="1 0.5;1 0.95;1 0.35;1 1;1 0.5" dur="1.5s" repeatCount="indefinite" additive="sum"/></rect></g>
      <g><rect x="33" y="-26" width="6" height="26" rx="3" fill="#7be39b">
        <animateTransform attributeName="transform" type="scale" values="1 0.9;1 0.3;1 1;1 0.55;1 0.9" dur="0.95s" repeatCount="indefinite" additive="sum"/></rect></g>
      <g><rect x="44" y="-26" width="6" height="26" rx="3" fill="#4f9cf9">
        <animateTransform attributeName="transform" type="scale" values="1 0.35;1 0.8;1 0.45;1 1;1 0.35" dur="1.7s" repeatCount="indefinite" additive="sum"/></rect></g>
    </g>

    <!-- mando -->
    <g transform="translate(128 196)" opacity="0.9">
      <rect x="0" y="0" width="44" height="26" rx="12" fill="#0f2c3f" stroke="#4f9cf9" stroke-width="1.4"/>
      <g fill="#4f9cf9"><rect x="8" y="11" width="11" height="3.4" rx="1.7"/><rect x="11.8" y="7.2" width="3.4" height="11" rx="1.7"/></g>
      <circle cx="31" cy="10" r="2.6" fill="#7be39b"/><circle cx="36" cy="16" r="2.6" fill="#7be39b"/>
    </g>

    <!-- texto -->
    <g font-family="Verdana, 'DejaVu Sans', Geneva, sans-serif">
      <text x="52" y="112" font-size="46" font-weight="bold" fill="#f2fbf6" letter-spacing="1">maurolando</text>
      <text x="54" y="142" font-size="14.5" fill="#7be39b" letter-spacing="3.4">ANALISTA DE SISTEMAS &#183; PARAGUAY</text>
      <text x="54" y="170" font-size="13" fill="#9fc8d8" letter-spacing="0.6">backend con Java &#183; frontend con Angular &#183; cactus en el escritorio</text>
    </g>

    <rect x="0.75" y="0.75" width="998.5" height="278.5" rx="14" fill="none" stroke="#2f9e6b" stroke-width="1.5" opacity="0.45"/>
  </g>
</svg>
