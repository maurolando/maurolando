name: Actualizar calendario de contribuciones

on:
  schedule:
    - cron: '17 6 * * *'   # todos los dias 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contrib-chart
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar assets/contrib.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/contrib_chart.py

      - name: Commitear si cambio
        run: |
          if [ -z "$(git status --porcelain assets/contrib.svg)" ]; then
            echo "sin cambios"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib.svg
          git commit -m "chore: actualizar calendario de contribuciones"
          git push
